<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guest Form</title>
<link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet">
<style>
body { margin:0; font-family:'Glacial Indifference', sans-serif; background:#f6f7fb; }
.sidebar { width:220px; height:100vh; background:#fff; border-right:1px solid #ddd; position:fixed; top:0; left:0; display:flex; flex-direction:column; }
.sidebar .logo { font-weight:bold; font-size:20px; padding:20px; border-bottom:1px solid #ddd; }
.sidebar ul { list-style:none; padding:0; margin:0; flex:1; }
.sidebar ul li { padding:15px 20px; cursor:pointer; transition:0.2s; }
.sidebar ul li:hover { background:#f2f2f2; }
.main-content { margin-left:220px; padding:30px; }
input, select { padding:10px; width:200px; margin-bottom:10px; border-radius:6px; border:1px solid #ccc; display:block; }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="logo">HotelApp</div>
  <ul>
    <li onclick="goPage('index.html')">🏠 Dashboard</li>
    <li onclick="goPage('rooms.html')">🛏️ Rooms</li>
    <li onclick="goPage('form.html')">👤 Guests</li>
    <li onclick="goPage('payments.html')">💳 Payments</li>
    <li onclick="goPage('settings.html')">⚙️ Settings</li>
  </ul>
</div>

<div class="main-content">
  <h1>Guest Form</h1>
  <label>Room No</label>
  <input type="text" id="room" readonly>
  <label>Check-in</label>
  <input type="date" id="checkin">
  <label>Check-out</label>
  <input type="date" id="checkout">
  <label>Guest Name</label>
  <input type="text" id="guestName">
  <button onclick="submitForm()">Submit</button>
</div>

<script>
function goPage(url) { window.location.href = url; }

// Prefill Room No from URL
const params = new URLSearchParams(window.location.search);
document.getElementById('room').value = params.get('room') || '';

// Disable past dates
const today = new Date().toISOString().split('T')[0];
document.getElementById('checkin').setAttribute('min', today);
document.getElementById('checkout').setAttribute('min', today);

function submitForm() {
  const room = document.getElementById('room').value;
  const checkin = document.getElementById('checkin').value;
  const checkout = document.getElementById('checkout').value;
  const name = document.getElementById('guestName').value;

  if(!room || !checkin || !checkout || !name) {
    alert('Please fill all fields!');
    return;
  }
  alert(`Guest ${name} booked for Room ${room} from ${checkin} to ${checkout}`);
}
</script>

</body>
</html>
