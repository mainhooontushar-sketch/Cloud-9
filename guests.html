<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest List - HotelApp</title>
    <link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet">
    <style>
        :root { 
            --primary-red: #ff385c; 
            --bg-gray: #f6f7fb; 
            --sidebar-width: 220px; 
            --success-green: #2e7d32; 
            --delayed-purple: #8e44ad;
        }
        body { margin:0; font-family:'Glacial Indifference', sans-serif; background: var(--bg-gray); color: #333; font-size: 14px; }
        
        /* Universal 8px Design */
        input, select, .btn-co, .btn-info, .table-container, .modal-content, .guest-box, .info-header-box, .stat-card { 
            border-radius: 8px !important; 
        }

        .sidebar { width: var(--sidebar-width); height:100vh; background:#fff; border-right:1px solid #ddd; position:fixed; top:0; left:0; display:flex; flex-direction:column; z-index: 100;}
        .sidebar .logo { font-weight:bold; font-size:20px; padding:20px; border-bottom:1px solid #ddd; color: var(--primary-red); }
        .sidebar ul { list-style:none; padding:0; margin:0; flex:1; }
        .sidebar ul li { padding:15px 20px; cursor:pointer; transition: 0.2s; border-left: 4px solid transparent; }
        .sidebar ul li:hover { background:#f9f9f9; border-left: 4px solid var(--primary-red); }
        
        .main-content { margin-left: var(--sidebar-width); padding:40px; }
        
        /* Stats Dashboard Section */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-card { 
            background: #fff; padding: 15px; border: 1px solid #ddd; cursor: pointer; 
            transition: 0.2s; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .stat-card:hover { border-color: var(--primary-red); background: #fafafa; }
        .stat-card.active { border: 2px solid var(--primary-red); background: #fff5f6; }
        .stat-card h3 { margin: 0; font-size: 10px; color: #777; text-transform: uppercase; }
        .stat-card p { margin: 8px 0 0; font-size: 24px; font-weight: bold; color: #111; }

        .search-box { margin-bottom: 20px; }
        .search-box input { width: 100%; max-width: 400px; padding: 12px 15px; border: 1px solid #ddd; outline: none; }

        .table-container { background: #fff; border: 1px solid #ddd; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #f9f9f9; padding: 15px; font-size: 11px; text-transform: uppercase; color: #777; border-bottom: 1px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #eee; font-size: 13px; }

        .badge { padding: 5px 12px; border-radius: 15px; font-size: 10px; font-weight: bold; }
        .badge-in { background: #e8f5e9; color: var(--success-green); }
        .badge-delayed { background: #f3e5f5; color: var(--delayed-purple); }
        .badge-out { background: #f5f5f5; color: #999; }

        .btn-info { background: #f0f0f0; border: none; padding: 8px 12px; cursor: pointer; color: #555; font-weight: bold; font-size: 12px; }
        .btn-co { background: var(--primary-red); color: white; border: none; padding: 8px 15px; cursor: pointer; font-size: 11px; font-weight: bold; text-decoration: none; }

        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:1000; backdrop-filter: blur(4px); }
        .modal-content { background:#fff; padding:30px; width:520px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo">HotelApp</div>
    <ul>
        <li onclick="location.href='index.html'">🏠 Dashboard</li>
        <li onclick="location.href='rooms.html'">🛏️ Rooms</li>
        <li onclick="location.href='form.html'">👤 Guests</li>
        <li onclick="location.href='payments.html'">💳 Payments</li>
    </ul>
</div>

<div class="main-content">
    <h1 style="margin:0 0 25px 0;">Guest Directory</h1>

    <div class="search-box">
        <input type="text" id="guestSearch" placeholder="Search name or room..." onkeyup="filterBySearch()">
    </div>

    <div class="stats-grid">
        <div class="stat-card active" id="tabAll" onclick="filterByStatus('all')">
            <h3>History</h3>
            <p id="statTotal">0</p>
        </div>
        <div class="stat-card" id="tabIn" onclick="filterByStatus('in')">
            <h3>In-House</h3>
            <p id="statIn" style="color: var(--success-green);">0</p>
        </div>
        <div class="stat-card" id="tabDelayed" onclick="filterByStatus('delayed')">
            <h3>Delayed</h3>
            <p id="statDelayed" style="color: var(--delayed-purple);">0</p>
        </div>
        <div class="stat-card" id="tabOut" onclick="filterByStatus('out')">
            <h3>Checked Out</h3>
            <p id="statOut" style="color: #999;">0</p>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Room</th>
                    <th>Guest Name</th>
                    <th>Check-Out Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="guestBody"></tbody>
        </table>
    </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwPi0GEY5z3v6cK53ZSgjHQksz73JcDY3tL16b9WH9Mqf18b0WR2EwOWWq17JKA8Z_K/exec'; 
let allBookings = [];

async function loadData() {
    try {
        const response = await fetch(SCRIPT_URL + "?action=getFullStatus");
        const data = await response.json();
        allBookings = data.allBookings || []; 
        updateStats();
        renderTable(allBookings);
    } catch (e) { console.error("Error fetching data", e); }
}

function updateStats() {
    const today = new Date().setHours(0,0,0,0);
    const total = allBookings.length;
    
    const inHouseList = allBookings.filter(b => b.checkout === 'OPEN' || b.checkout === '');
    const outList = allBookings.filter(b => b.checkout !== 'OPEN' && b.checkout !== '');
    
    // Delayed = In-House AND the Checkout date column (if it was specified) is in the past
    // NOTE: If checkout is "OPEN", it isn't strictly delayed unless you have a separate "Expected Checkout" column.
    // However, if the user entered a date in Column D but hasn't checked out yet, it will trigger here.
    const delayedList = inHouseList.filter(b => {
        // If a specific date exists in Column D but status is still effectively OPEN
        // (Assuming your checkout column contains a date even for active guests if they planned a date)
        if(b.checkout && b.checkout !== "OPEN") {
            return new Date(b.checkout).setHours(0,0,0,0) < today;
        }
        return false;
    });

    document.getElementById('statTotal').innerText = total;
    document.getElementById('statIn').innerText = inHouseList.length;
    document.getElementById('statOut').innerText = outList.length;
    document.getElementById('statDelayed').innerText = delayedList.length;
}

function filterByStatus(status) {
    document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
    document.getElementById('tab' + status.charAt(0).toUpperCase() + status.slice(1)).classList.add('active');
    
    const today = new Date().setHours(0,0,0,0);

    if(status === 'all') renderTable(allBookings);
    else if(status === 'in') renderTable(allBookings.filter(b => b.checkout === 'OPEN' || b.checkout === ''));
    else if(status === 'out') renderTable(allBookings.filter(b => b.checkout !== 'OPEN' && b.checkout !== ''));
    else if(status === 'delayed') {
        renderTable(allBookings.filter(b => (b.checkout !== 'OPEN' && b.checkout !== '') === false && new Date(b.checkout).setHours(0,0,0,0) < today));
    }
}

function renderTable(list) {
    const tbody = document.getElementById('guestBody');
    tbody.innerHTML = '';
    const today = new Date().setHours(0,0,0,0);

    list.forEach((g, idx) => {
        const isInHouse = g.checkout === 'OPEN' || g.checkout === '';
        let isDelayed = false;
        if(isInHouse && g.checkout !== "OPEN" && g.checkout !== "") {
            isDelayed = new Date(g.checkout).setHours(0,0,0,0) < today;
        }

        const row = document.createElement('tr');
        row.innerHTML = `
            <td style="font-weight:bold; color:var(--primary-red);">${g.room}</td>
            <td>${g.g1Name}</td>
            <td>${g.checkout || 'OPEN'}</td>
            <td>
                <span class="badge ${isInHouse ? (isDelayed ? 'badge-delayed' : 'badge-in') : 'badge-out'}">
                    ${isInHouse ? (isDelayed ? 'DELAYED' : 'In-House') : 'Out'}
                </span>
            </td>
            <td>
                <button class="btn-info" onclick="openInfo(${idx})">INFO</button>
                ${isInHouse ? `<a href="rooms.html" class="btn-co">CHECKOUT</a>` : ''}
            </td>`;
        tbody.appendChild(row);
    });
}

function filterBySearch() {
    const val = document.getElementById('guestSearch').value.toLowerCase();
    const filtered = allBookings.filter(b => b.g1Name.toLowerCase().includes(val) || b.room.toString().includes(val));
    renderTable(filtered);
}

// Reuse existing extractUrl, openInfo, closeModals functions from previous version
window.onload = loadData;
</script>
</body>
</html>
