<!DOCTYPE html>
<html>
<head>
    <title>Guest Entry</title>
    <style>
        body { font-family: 'Century Gothic', sans-serif; padding: 20px; background: #f6f7fb; }
        .container { background: white; padding: 20px; border-radius: 10px; max-width: 600px; margin: auto; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        .upload-btn { background: #eee; cursor: pointer; text-align: center; display: block; padding: 10px; border: 1px dashed #bbb; }
        .success-btn { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .btn-primary { background: #ff385c; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>Guest Registration</h2>
    <input id="roomNo" placeholder="Room Number" readonly>
    <input id="checkin" type="date">
    <input id="checkout" type="date">
    
    <div id="guestArea">
        <div class="guest-card">
            <input class="name" placeholder="Full Name">
            <input class="mobile" placeholder="Mobile" maxlength="10">
            <select class="doctype"><option>AADHAAR</option><option>PASSPORT</option></select>
            <input class="docnumber" placeholder="ID Number">
            <label class="upload-btn" id="uploadLabel">📁 Upload ID
                <input type="file" id="fileInput" style="display:none" onchange="handleFile(this)">
            </label>
        </div>
    </div>

    <select id="payMethod">
        <option value="">Select Payment</option>
        <option value="Cash">Cash</option>
        <option value="UPI">UPI</option>
    </select>
    
    <button class="btn-primary" id="submitBtn" onclick="submitForm()">FINALIZE BOOKING</button>
</div>

<script>
    // 1. PASTE YOUR URL HERE
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwyoQ8VgBCp4k4KsyzWH21zex0HoDeFIylf97IrXTW-Irx7EcsIR_wEnvFhqn0MrKGs/exec";

    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        document.getElementById('roomNo').value = params.get('room') || "N/A";
        document.getElementById('checkin').value = new Date().toISOString().split('T')[0];
    };

    function handleFile(input) {
        const label = document.getElementById('uploadLabel');
        if(input.files.length > 0) {
            label.innerText = "✅ " + input.files[0].name;
            label.classList.add('success-btn');
        }
    }

    async function submitForm() {
        const btn = document.getElementById('submitBtn');
        const file = document.getElementById('fileInput').files[0];
        
        if(!file) return alert("Please upload ID");
        
        btn.innerText = "Processing...";
        btn.disabled = true;

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async () => {
            const base64 = reader.result.split(',')[1];
            
            const payload = {
                room: document.getElementById('roomNo').value,
                checkin: document.getElementById('checkin').value,
                checkout: document.getElementById('checkout').value,
                method: document.getElementById('payMethod').value,
                guests: [{
                    name: document.querySelector('.name').value,
                    mobile: document.querySelector('.mobile').value,
                    docType: document.querySelector('.doctype').value,
                    docNumber: document.querySelector('.docnumber').value,
                    fileData: base64,
                    fileName: file.name,
                    fileType: file.type
                }]
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)
                });
                alert("Booking Successful!");
                window.location.href = "rooms.html";
            } catch (e) {
                alert("Error!");
                btn.disabled = false;
                btn.innerText = "FINALIZE BOOKING";
            }
        };
    }
</script>

</body>
</html>
