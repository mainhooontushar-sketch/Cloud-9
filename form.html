<!DOCTYPE html>
<html>
<head>
<base target="_top">
<link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet">

<style>
/* ========== YOUR ORIGINAL CSS ========== */

/* GLOBAL FONT */
select {
  -webkit-appearance: none; 
  -moz-appearance: none;    
  appearance: none;
  background: transparent;
  padding-right: 10px;      
  border: 1px solid #ddd;
  border-radius: 8px;
  font-family: 'Glacial Indifference', sans-serif;
}
.select-wrapper {
  position: relative;
  display: inline-block;
}
.select-wrapper::after {
  content: ''; 
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
}

body,
input,
select,
button,
textarea,
option{
  font-family:'Glacial Indifference', sans-serif;
  text-transform:none;
}
::placeholder{
  text-transform:none;
  font-family:'Glacial Indifference', sans-serif;
}
.doctype,
.doctype option{
  font-family:'Glacial Indifference', sans-serif;
}




/* NEW: sidebar layout */
.sidebar{
  width:200px;
  background:#fff;
  height:100vh;
  position:fixed;
  top:0;
  left:0;
  box-shadow:2px 0 5px rgba(0,0,0,0.1);
  padding:20px 10px;
  box-sizing:border-box;
}
.sidebar .logo{
  font-weight:bold;
  margin-bottom:20px;
  text-align:center;
}
.sidebar ul{
  list-style:none;
  padding:0;
}
.sidebar ul li{
  padding:10px;
  cursor:pointer;
  margin-bottom:5px;
  border-radius:6px;
  transition:0.2s;
}
.sidebar ul li:hover{
  background:#ff385c;
  color:white;
}

/* push main content */
.main-content{
  margin-left:220px; /* width of sidebar + padding */
  padding:20px;
}

/* container and original form CSS */
.container{
  background:white;
  padding:35px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}
.top,.row{
  display:flex;
  gap:12px;
  margin-bottom:18px;
}
.field{
  position:relative;
}
input,select{
  height:46px;
  padding:0 12px;
  border-radius:8px;
  border:1px solid #ddd;
  font-size:14px;
  outline:none;
  background:white;
}
input:focus,select:focus{
  border-color:#ff385c;
  box-shadow:0 0 0 2px rgba(255,56,92,0.15);
}
.field label{
  position:absolute;
  left:12px;
  top:14px;
  font-size:13px;
  background:white;
  padding:0 4px;
  color:#777;
  transition:0.2s;
  pointer-events:none;
}
.field input:focus+label,
.field input:not(:placeholder-shown)+label{
  top:-8px;
  font-size:11px;
  color:#ff385c;
}
.mobile-error{
  font-size:11px;
  color:red;
  margin-top:3px;
}
.upload-area{
  display:flex;
  flex-direction:column;
}
.upload-btn{
  height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ff385c;
  color:white;
  border-radius:8px;
  cursor:pointer;
  padding:0 14px;
}
.upload-btn.uploaded{
  background:#28a745;
}
.upload-btn input{
  display:none;
}
.filename{
  font-size:11px;
  margin-top:4px;
  color:#666;
}
.delete-btn{
  width:46px;
  height:46px;
  border:none;
  border-radius:8px;
  background:#ff385c;
  color:white;
  cursor:pointer;
}
.guest.second .upload-btn{
  margin-right:50px;
}
button{
  padding:12px 18px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
.add{
  background:#eee;
}
.save{
  background:#ff385c;
  color:white;
  margin-top:15px;
}
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-content{
  background:white;
  padding:30px;
  width:380px;
  border-radius:12px;
  text-align:center;
}
.payment-options{
  display:flex;
  gap:10px;
  margin:20px 0;
}
.pay-btn{
  flex:1;
  padding:12px;
  border-radius:8px;
  border:1px solid #ddd;
  cursor:pointer;
}
.pay-btn.active{
  background:#ff385c;
  color:white;
  border:none;
}
.qr{
  display:none;
  margin-top:15px;
}
.qr img{
  width:180px;
}
.pay-now{
  background:#28a745;
  color:white;
  width:100%;
  margin-top:10px;
}
.close-btn{
  background:#eee;
  width:100%;
  margin-top:8px;
}
.success{
  display:none;
  font-size:18px;
  color:#28a745;
  margin-top:15px;
}

/* disable past dates */
</style>
</head>

<body>

<!-- ========== SIDEBAR ========== -->
<div class="sidebar">
  <div class="logo">HotelApp</div>
  <ul>
    <li onclick="goPage('index.html')">🏠 Dashboard</li>
    <li onclick="goPage('rooms.html')">🛏️ Rooms</li>
    <li onclick="goPage('form.html')">👤 Guests</li>
    <li onclick="goPage('payments.html')">💳 Payments</li>
    <li onclick="goPage('settings.html')">⚙️ Settings</li>
  </ul>
</div>

<!-- ========== MAIN CONTENT ========== -->
<div class="main-content">
<div class="container">

<h2>Guest Entry</h2>

<div class="top">

<div class="field">
<input id="room" placeholder=" ">
<label>ROOM NO</label>
</div>

<input id="checkin" type="date">

<input id="checkout" type="date">

</div>

<div id="guestContainer">

<div class="row guest">

<div class="field">
<input class="name" placeholder=" ">
<label>NAME</label>
</div>

<div>
<div class="field">
<input class="mobile" maxlength="10" placeholder=" ">
<label>MOBILE</label>
</div>
<div class="mobile-error"></div>
</div>

<select class="doctype">
<option>AADHAAR</option>
<option>PASSPORT</option>
<option>DRIVING LICENSE</option>
<option>VOTER ID</option>
</select>

<div class="field">
<input class="docnumber" placeholder=" ">
<label>DOCUMENT NO</label>
</div>

<div class="upload-area">

<label class="upload-btn">
UPLOAD DOCUMENT
<input type="file" class="docfile">
</label>

<div class="filename"></div>

</div>

<button class="delete-btn" style="display:none;" onclick="removeGuest(this)">✕</button>

</div>

</div>

<button class="add" onclick="addGuest()">+ ADD GUEST</button>

<br>

<button class="save" onclick="validateAndPay()">SAVE & PAY</button>

</div>
</div>

<!-- ========== PAYMENT MODAL ========== -->
<div class="modal" id="paymentModal">
<div class="modal-content">
<h3>Select Payment</h3>
<div class="payment-options">
<div class="pay-btn" onclick="selectPay(this,'cash')">Cash</div>
<div class="pay-btn" onclick="selectPay(this,'card')">Card</div>
<div class="pay-btn" onclick="selectPay(this,'upi')">UPI</div>
</div>

<div class="qr" id="qrBox">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay">
<p>Scan & Pay</p>
</div>

<button class="pay-now" onclick="completePayment()">PAY NOW</button>
<button class="close-btn" onclick="closePayment()">CLOSE</button>

<div class="success" id="successMsg">
Room Booked Successfully
</div>

</div>
</div>

<script>
// ========== SIDEBAR NAVIGATION ==========
function goPage(url){ window.location.href = url; }

// ========== MOBILE VALIDATION ==========
document.addEventListener("input",function(e){
if(e.target.classList.contains("mobile")){
e.target.value=e.target.value.replace(/[^0-9]/g,'');
let error=e.target.closest("div").parentElement.querySelector(".mobile-error");
if(e.target.value.length!=10){ error.innerText="Mobile must be 10 digits"; }else{ error.innerText=""; }
}
});

// ========== FILE UPLOAD ==========
document.addEventListener("change",function(e){
if(e.target.classList.contains("docfile")){
let file=e.target.files[0]?.name || "";
let area=e.target.closest(".upload-area");
area.querySelector(".filename").innerText=file;
let btn=area.querySelector(".upload-btn");
btn.classList.add("uploaded");
btn.childNodes[0].textContent="DOCUMENT UPLOADED";
}
});

// ========== ADD & DELETE GUEST ==========
function addGuest(){
let guests=document.querySelectorAll(".guest");
if(guests.length>=2){ alert("Only 2 guests allowed per room"); return; }
let row=document.querySelector(".guest").cloneNode(true);
row.classList.add("second");
row.querySelectorAll("input").forEach(i=>i.value="");
row.querySelector(".filename").innerText="";
row.querySelector(".mobile-error").innerText="";
let btn=row.querySelector(".upload-btn");
btn.classList.remove("uploaded");
btn.childNodes[0].textContent="UPLOAD DOCUMENT";
row.querySelector(".delete-btn").style.display="block";
document.getElementById("guestContainer").appendChild(row);
}
function removeGuest(btn){ btn.closest(".guest").remove(); }

// ========== VALIDATION ==========
function validateAndPay(){
let room=document.getElementById("room").value.trim();
let checkin=document.getElementById("checkin").value;
let checkout=document.getElementById("checkout").value;
if(room===""||checkin===""||checkout===""){ alert("Please fill Room No, Check-in and Check-out"); return; }
let guests=document.querySelectorAll(".guest");
for(let g of guests){
let name=g.querySelector(".name").value.trim();
let mobile=g.querySelector(".mobile").value.trim();
let doc=g.querySelector(".docnumber").value.trim();
if(name===""||mobile===""||doc===""){ alert("Please complete guest details"); return; }
if(mobile.length!==10){ alert("Mobile must be 10 digits"); return; }
}
openPayment();
}

  //submit enw //

  function submitToSheet() {
  const room = document.getElementById("room").value.trim();
  const checkin = document.getElementById("checkin").value;
  const checkout = document.getElementById("checkout").value;

  const guestsEls = document.querySelectorAll(".guest");
  const guests = Array.from(guestsEls).map(g => ({
    name: g.querySelector(".name").value.trim(),
    mobile: g.querySelector(".mobile").value.trim(),
    docType: g.querySelector(".doctype").value,
    docNumber: g.querySelector(".docnumber").value.trim()
  }));

  const data = { room, checkin, checkout, guests };

  fetch("https://script.google.com/macros/s/AKfycbyTZggXHEhTz5tkdyVscdQvoUKJ6MiY3z3qsrKjk930W_N70s3paq_ypJr8x3XKBtBB/exec", {
    method: "POST",
    body: JSON.stringify(data),
    headers: { "Content-Type": "application/json" }
  })
  .then(res => res.json())
  .then(res => {
    if(res.status === "success") {
      alert("Booking submitted successfully!");
      resetForm();
    } else {
      alert("Error: " + res.message);
    }
  })
  .catch(err => alert("Error submitting form: " + err.message));
}

  //complete pa//

  function submitToSheet() {
  const room = document.getElementById("room").value.trim();
  const checkin = document.getElementById("checkin").value;
  const checkout = document.getElementById("checkout").value;

  const guestsEls = document.querySelectorAll(".guest");
  const guests = Array.from(guestsEls).map(g => ({
    name: g.querySelector(".name").value.trim(),
    mobile: g.querySelector(".mobile").value.trim(),
    docType: g.querySelector(".doctype").value,
    docNumber: g.querySelector(".docnumber").value.trim()
  }));

  const data = { room, checkin, checkout, guests };

  fetch("YOUR_WEB_APP_URL", {
    method: "POST",
    body: JSON.stringify(data),
    headers: { "Content-Type": "application/json" }
  })
  .then(res => res.json())
  .then(res => {
    if(res.status === "success") {
      alert("Booking submitted successfully!");
      resetForm();
    } else {
      alert("Error: " + res.message);
    }
  })
  .catch(err => alert("Error submitting form: " + err.message));
}

// ========== PAYMENT ==========
function openPayment(){ document.getElementById("paymentModal").style.display="flex"; }
function closePayment(){ document.getElementById("paymentModal").style.display="none"; resetForm(); }
function selectPay(el,type){
document.querySelectorAll(".pay-btn").forEach(b=>b.classList.remove("active"));
el.classList.add("active");
if(type==="upi"){ document.getElementById("qrBox").style.display="block"; }else{ document.getElementById("qrBox").style.display="none"; }
}
function completePayment(){
document.getElementById("successMsg").style.display="block";
setTimeout(function(){
document.getElementById("paymentModal").style.display="none";
document.getElementById("successMsg").style.display="none";
resetForm();
},2000);
}

// ========== RESET ==========
function resetForm(){
document.querySelectorAll("input").forEach(i=>i.value="");
document.querySelectorAll(".filename").forEach(f=>f.innerText="");
document.querySelectorAll(".mobile-error").forEach(e=>e.innerText="");
document.querySelectorAll(".upload-btn").forEach(btn=>{
btn.classList.remove("uploaded");
btn.childNodes[0].textContent="UPLOAD DOCUMENT";
});
}

// ========== DISABLE PAST DATES ==========
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().split('T')[0];
  const checkin = document.getElementById('checkin');
  const checkout = document.getElementById('checkout');
  checkin.setAttribute('min', today);
  checkout.setAttribute('min', today);
  checkin.addEventListener('change', () => {
    if(checkin.value){
      checkout.setAttribute('min', checkin.value);
      if(checkout.value && checkout.value < checkin.value){
        checkout.value = checkin.value;
      }
    }
  });

  // ========== PREFILL ROOM NO FROM URL ==========
  const params = new URLSearchParams(window.location.search);
  const roomNo = params.get('room');
  if(roomNo){
    document.getElementById('room').value = roomNo;
  }
});
</script>

</body>
</html>
