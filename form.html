<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guest Form</title>
<link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet">
<style>
/* Sidebar */
body { margin:0; font-family:'Glacial Indifference', sans-serif; background:#f6f7fb; }
.sidebar { width:220px; height:100vh; background:#fff; border-right:1px solid #ddd; position:fixed; top:0; left:0; display:flex; flex-direction:column; }
.sidebar .logo { font-weight:bold; font-size:20px; padding:20px; border-bottom:1px solid #ddd; }
.sidebar ul { list-style:none; padding:0; margin:0; flex:1; }
.sidebar ul li { padding:15px 20px; cursor:pointer; transition:0.2s; }
.sidebar ul li:hover { background:#f2f2f2; }
.main-content { margin-left:220px; padding:30px; }

/* Form Container */
.container { background:white; padding:30px; border-radius:12px; max-width:600px; }
.top, .row { display:flex; gap:12px; margin-bottom:18px; }
.field { position:relative; flex:1; }

/* Inputs & floating labels */
input, select { height:46px; padding:0 12px; border-radius:8px; border:1px solid #ddd; font-size:14px; width:100%; outline:none; background:white; }
input:focus, select:focus { border-color:#ff385c; box-shadow:0 0 0 2px rgba(255,56,92,0.15); }
.field label { position:absolute; left:12px; top:14px; font-size:13px; background:white; padding:0 4px; color:#777; transition:0.2s; pointer-events:none; }
.field input:focus+label,
.field input:not(:placeholder-shown)+label,
.field select:focus+label,
.field select:not([value=""])+label { top:-8px; font-size:11px; color:#ff385c; }

/* Upload area */
.upload-area { display:flex; flex-direction:column; }
.upload-btn { height:46px; display:flex; align-items:center; justify-content:center; background:#ff385c; color:white; border-radius:8px; cursor:pointer; padding:0 14px; }
.upload-btn.uploaded { background:#28a745; }
.upload-btn input { display:none; }
.filename { font-size:11px; margin-top:4px; color:#666; }

/* Delete button */
.delete-btn { width:46px; height:46px; border:none; border-radius:8px; background:#ff385c; color:white; cursor:pointer; display:none; }

/* Add & Save buttons */
button.add { background:#eee; padding:12px 18px; border-radius:8px; border:none; cursor:pointer; }
button.save { background:#ff385c; color:white; padding:12px 18px; border:none; border-radius:8px; margin-top:15px; cursor:pointer; }

/* Rooms container for dynamic demo if needed */
.rooms-container { display:flex; flex-wrap:wrap; gap:20px; margin-top:20px; }
.room-box { width:120px; height:120px; background:#fff; border-radius:12px; border:1px solid #ddd; display:flex; align-items:center; justify-content:center; font-weight:bold; cursor:pointer; transition:0.2s; }
.room-box:hover { transform:translateY(-3px); box-shadow:0 6px 12px rgba(0,0,0,0.1); }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="logo">HotelApp</div>
  <ul>
    <li onclick="goPage('index.html')">🏠 Dashboard</li>
    <li onclick="goPage('rooms.html')">🛏️ Rooms</li>
    <li onclick="goPage('form.html')">👤 Guests</li>
    <li onclick="goPage('payments.html')">💳 Payments</li>
    <li onclick="goPage('settings.html')">⚙️ Settings</li>
  </ul>
</div>

<div class="main-content">
  <h1>Guest Form</h1>
  <div id="guestContainer">

    <div class="row guest">
      <div class="field">
        <input class="name" placeholder=" "><label>NAME</label>
      </div>
      <div class="field">
        <input class="mobile" placeholder=" " maxlength="10"><label>MOBILE</label>
        <div class="mobile-error"></div>
      </div>
      <div class="field">
        <select class="doctype"><option value="">DOCUMENT TYPE</option><option>AADHAAR</option><option>PASSPORT</option><option>DRIVING LICENSE</option><option>VOTER ID</option></select>
        <label>DOCUMENT TYPE</label>
      </div>
      <div class="field">
        <input class="docnumber" placeholder=" "><label>DOCUMENT NO</label>
      </div>
      <div class="upload-area">
        <label class="upload-btn">UPLOAD DOCUMENT
          <input type="file" class="docfile">
        </label>
        <div class="filename"></div>
      </div>
      <button class="delete-btn" onclick="removeGuest(this)">✕</button>
    </div>

  </div>
  <button class="add" onclick="addGuest()">+ ADD GUEST</button>
  <button class="save" onclick="submitForm()">SAVE</button>
</div>

<script>
function goPage(url) { window.location.href = url; }

// Prefill Room No from URL
const params = new URLSearchParams(window.location.search);
const roomNo = params.get('room');
if(roomNo){
  // You can optionally show Room No at top
  const header = document.createElement('div');
  header.innerHTML = `<strong>Room No:</strong> ${roomNo}`;
  document.querySelector('.main-content').insertBefore(header, document.getElementById('guestContainer'));
}

// Mobile validation
document.addEventListener("input",function(e){
  if(e.target.classList.contains("mobile")){
    e.target.value=e.target.value.replace(/[^0-9]/g,'');
    let error=e.target.closest(".field").querySelector(".mobile-error");
    error.innerText = e.target.value.length!==10 ? "Mobile must be 10 digits" : "";
  }
});

// File upload
document.addEventListener("change",function(e){
  if(e.target.classList.contains("docfile")){
    const fileName = e.target.files[0]?.name || "";
    const area = e.target.closest(".upload-area");
    area.querySelector(".filename").innerText = fileName;
    e.target.closest(".upload-btn").classList.add("uploaded");
  }
});

// Add guest row
function addGuest(){
  const guests = document.querySelectorAll(".guest");
  if(guests.length >= 2) { alert("Only 2 guests allowed per room"); return; }
  const row = guests[0].cloneNode(true);
  row.querySelectorAll("input").forEach(i=>i.value="");
  row.querySelector(".filename").innerText="";
  row.querySelector(".mobile-error").innerText="";
  row.querySelector(".delete-btn").style.display="block";
  document.getElementById("guestContainer").appendChild(row);
}

// Delete guest row
function removeGuest(btn){ btn.closest(".guest").remove(); }

// Form submit
function submitForm(){
  const guests = document.querySelectorAll(".guest");
  for(let g of guests){
    const name = g.querySelector(".name").value.trim();
    const mobile = g.querySelector(".mobile").value.trim();
    const doc = g.querySelector(".docnumber").value.trim();
    const type = g.querySelector(".doctype").value;
    if(!name || !mobile || !doc || !type){ alert("Please complete guest details"); return; }
    if(mobile.length!==10){ alert("Mobile must be 10 digits"); return; }
  }
  alert(`Guests for Room ${roomNo} saved successfully!`);
}
</script>

</body>
</html>
