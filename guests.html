<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest List - HotelApp</title>
    <link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet">
    <style>
        :root {
            --primary-red: #ff385c;
            --bg-gray: #f6f7fb;
            --sidebar-width: 220px;
            --success-green: #2e7d32;
        }

        body { margin:0; font-family:'Glacial Indifference', sans-serif; background: var(--bg-gray); color: #333; font-size: 14px; }
        
        /* Universal 8px Design */
        input, .btn-co, .btn-info, .table-container, .modal-content, .guest-box, .info-header-box { 
            border-radius: 8px !important; 
        }

        .sidebar { width: var(--sidebar-width); height:100vh; background:#fff; border-right:1px solid #ddd; position:fixed; top:0; left:0; display:flex; flex-direction:column; z-index: 100;}
        .sidebar .logo { font-weight:bold; font-size:20px; padding:20px; border-bottom:1px solid #ddd; color: var(--primary-red); }
        .sidebar ul { list-style:none; padding:0; margin:0; flex:1; }
        .sidebar ul li { padding:15px 20px; cursor:pointer; transition: 0.2s; border-left: 4px solid transparent; }
        .sidebar ul li:hover { background:#f9f9f9; border-left: 4px solid var(--primary-red); }
        
        .main-content { margin-left: var(--sidebar-width); padding:40px; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { margin: 0; font-size: 28px; color: #111; }

        .search-box { flex: 1; max-width: 400px; margin-bottom: 20px; }
        .search-box input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; outline: none; font-family: inherit; }

        .table-container { background: #fff; border: 1px solid #ddd; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #f9f9f9; padding: 15px; font-size: 11px; text-transform: uppercase; color: #777; border-bottom: 1px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #eee; font-size: 13px; }

        .badge { padding: 5px 12px; border-radius: 15px; font-size: 10px; font-weight: bold; }
        .badge-in { background: #e8f5e9; color: var(--success-green); }
        .extra-guest-tag { color: var(--primary-red); font-size: 9px; font-weight: bold; background: #fff5f6; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }

        .btn-info { background: #f0f0f0; border: none; padding: 8px 12px; cursor: pointer; color: #555; font-weight: bold; font-size: 12px; }
        .btn-co { background: var(--primary-red); color: white; border: none; padding: 8px 15px; cursor: pointer; font-size: 11px; font-weight: bold; }

        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:1000; backdrop-filter: blur(4px); }
        .modal-content { background:#fff; padding:30px; width:520px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        
        .info-header-box { background: #fdfdfd; border: 1px solid #eee; padding: 15px; margin-bottom: 15px; }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .detail-item label { display: block; font-size: 9px; color: #999; font-weight: bold; text-transform: uppercase; }
        .detail-item span { font-size: 13px; color: #333; font-weight: bold; }

        .guest-box { border: 1px solid #eee; background: #fcfcfc; padding: 15px; margin-top: 10px; position: relative; }
        .guest-box h4 { margin: 0 0 10px 0; font-size: 14px; color: var(--primary-red); border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .btn-id-link { position: absolute; top: 15px; right: 15px; color: var(--primary-red); text-decoration: none; font-weight: bold; font-size: 10px; border: 1px solid var(--primary-red); padding: 3px 8px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo">HotelApp</div>
    <ul>
        <li onclick="location.href='index.html'">🏠 Dashboard</li>
        <li onclick="location.href='rooms.html'">🛏️ Rooms</li>
        <li onclick="location.href='form.html'">👤 Guests</li>
        <li onclick="location.href='payments.html'">💳 Payments</li>
    </ul>
</div>

<div class="main-content">
    <div class="header-row">
        <h1>Guest Directory</h1>
        <div id="status-indicator" style="font-size:12px; color:var(--success-green);">● Loading...</div>
    </div>

    <div class="search-box">
        <input type="text" id="guestSearch" placeholder="Search by name, room, or mobile..." onkeyup="filterTable()">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Room</th>
                    <th>Guest Name</th>
                    <th>Mobile No</th>
                    <th>Stay</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="guestBody"></tbody>
        </table>
    </div>
</div>

<div class="modal" id="infoModal">
    <div class="modal-content">
        <h2 style="margin-top:0; color: var(--primary-red);">Full Booking Details</h2>
        <div class="info-header-box">
            <div class="detail-grid">
                <div class="detail-item"><label>Booking ID</label><span id="infoBookingId">-</span></div>
                <div class="detail-item"><label>Room No</label><span id="infoRoomNo">-</span></div>
                <div class="detail-item"><label>Check-In</label><span id="infoCheckin">-</span></div>
                <div class="detail-item"><label>Check-Out</label><span id="infoCheckout">-</span></div>
                <div class="detail-item"><label>Payment Mode</label><span id="infoPayMethod">-</span></div>
                <div class="detail-item"><label>Due Amount</label><span id="infoDue" style="color:red;">-</span></div>
            </div>
        </div>

        <div id="infoG1" class="guest-box">
            <h4>Guest 1 (Primary)</h4>
            <div id="g1IdContainer"></div>
            <div class="detail-grid">
                <div class="detail-item"><label>Name</label><span id="detName1">-</span></div>
                <div class="detail-item"><label>Mobile</label><span id="detMob1">-</span></div>
            </div>
        </div>

        <div id="infoG2" class="guest-box" style="display:none;">
            <h4>Guest 2</h4>
            <div id="g2IdContainer"></div>
            <div class="detail-grid">
                <div class="detail-item"><label>Name</label><span id="detName2">-</span></div>
                <div class="detail-item"><label>Mobile</label><span id="detMob2">-</span></div>
            </div>
        </div>
        <button class="btn-co" style="width:100%; padding:15px; margin-top:15px;" onclick="closeModals()">CLOSE</button>
    </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxgrBuLWJTjkikq7KYQOup4JlUJmJwfPwgrRIfITe8ejbCm2EU2lK5vMY3-dMP-WHP2/exec'; 
let allBookings = [];

async function loadData() {
    try {
        const response = await fetch(SCRIPT_URL + "?action=getFullStatus");
        const data = await response.json();
        
        // We need to fetch ALL bookings for this directory, not just active ones
        // If your Apps Script currently only returns active bookings, we'll need to tweak Code.gs
        allBookings = data.allBookings || Object.values(data.bookings); 
        renderTable(allBookings);
        document.getElementById('status-indicator').innerText = "● System Live";
    } catch (e) {
        document.getElementById('status-indicator').innerText = "● Sync Error";
    }
}

function renderTable(list) {
    const tbody = document.getElementById('guestBody');
    tbody.innerHTML = '';
    
    list.forEach((g, idx) => {
        const row = document.createElement('tr');
        const checkin = new Date(g.checkin);
        const diffDays = Math.ceil(Math.abs(new Date() - checkin) / (1000 * 60 * 60 * 24)) || 1;
        
        row.innerHTML = `
            <td style="font-weight:bold; color:var(--primary-red);">${g.room}</td>
            <td>${g.g1Name || g.name} ${g.g2Name ? '<span class="extra-guest-tag">+1 Guest</span>' : ''}</td>
            <td>${g.g1Mob || 'N/A'}</td>
            <td>${diffDays} Days</td>
            <td><span class="badge badge-in">${g.checkout === 'OPEN' ? 'In-House' : 'Checked Out'}</span></td>
            <td>
                <button class="btn-info" onclick="openInfo(${idx})">ⓘ INFO</button>
                <button class="btn-co" onclick="location.href='rooms.html'">CHECKOUT</button>
            </td>`;
        tbody.appendChild(row);
    });
}

function openInfo(idx) {
    const g = allBookings[idx];
    document.getElementById('infoModal').style.display = 'flex';
    
    document.getElementById('infoBookingId').innerText = g.bookingId;
    document.getElementById('infoRoomNo').innerText = g.room;
    document.getElementById('infoCheckin').innerText = new Date(g.checkin).toLocaleDateString();
    document.getElementById('infoCheckout').innerText = g.checkout;
    document.getElementById('infoPayMethod').innerText = g.method;
    document.getElementById('infoDue').innerText = "₹" + (g.due || 0);

    // G1 Data
    document.getElementById('detName1').innerText = g.g1Name || "-";
    document.getElementById('detMob1').innerText = g.g1Mob || "-";
    document.getElementById('g1IdContainer').innerHTML = g.g1Id ? `<a href="${g.g1Id}" target="_blank" class="btn-id-link">VIEW ID</a>` : "";

    // G2 Data
    if(g.g2Name) {
        document.getElementById('infoG2').style.display = 'block';
        document.getElementById('detName2').innerText = g.g2Name;
        document.getElementById('detMob2').innerText = g.g2Mob;
        document.getElementById('g2IdContainer').innerHTML = g.g2Id ? `<a href="${g.g2Id}" target="_blank" class="btn-id-link">VIEW ID</a>` : "";
    } else {
        document.getElementById('infoG2').style.display = 'none';
    }
}

function filterTable() {
    const val = document.getElementById("guestSearch").value.toLowerCase();
    const filtered = allBookings.filter(b => 
        b.room.toLowerCase().includes(val) || 
        (b.g1Name && b.g1Name.toLowerCase().includes(val)) ||
        (b.name && b.name.toLowerCase().includes(val))
    );
    renderTable(filtered);
}

function closeModals() { document.getElementById('infoModal').style.display = 'none'; }
window.onload = loadData;
</script>
</body>
</html>
