<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guest Form</title>
<link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet">

<style>
/* GLOBAL FONT */
body, input, select, button, textarea, option{
    font-family:'Glacial Indifference', sans-serif;
    text-transform:none;
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* Layout */
body {
    display:flex;
    min-height:100vh;
    background:#f6f7fb;
}

/* SIDEBAR */
.sidebar {
    width:220px;
    background:#fff;
    padding:20px;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
}
.sidebar .logo {
    font-size:20px;
    font-weight:700;
    margin-bottom:20px;
}
.sidebar ul {
    list-style:none;
    padding:0;
}
.sidebar ul li {
    padding:12px 10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    border-radius:8px;
    transition:0.2s;
}
.sidebar ul li:hover {
    background:#ff385c;
    color:white;
}

/* MAIN CONTENT */
.main {
    flex:1;
    padding:35px;
}

/* FORM STYLING */
.container{
    background:white;
    padding:25px 35px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.top, .row {
    display:flex;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.field {
    position:relative;
    flex:1;
}

input, select {
    height:46px;
    padding:0 12px;
    border-radius:8px;
    border:1px solid #ddd;
    font-size:14px;
    outline:none;
    background:white;
    width:100%;
}

input:focus, select:focus{
    border-color:#ff385c;
    box-shadow:0 0 0 2px rgba(255,56,92,0.15);
}

/* FLOAT LABEL */
.field label{
    position:absolute;
    left:12px;
    top:14px;
    font-size:13px;
    background:white;
    padding:0 4px;
    color:#777;
    transition:0.2s;
    pointer-events:none;
}
.field input:focus + label,
.field input:not(:placeholder-shown) + label{
    top:-8px;
    font-size:11px;
    color:#ff385c;
}

/* MOBILE ERROR */
.mobile-error{
    font-size:11px;
    color:red;
    margin-top:3px;
}

/* UPLOAD AREA */
.upload-area{
    display:flex;
    flex-direction:column;
}
.upload-btn{
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#ff385c;
    color:white;
    border-radius:8px;
    cursor:pointer;
    padding:0 14px;
}
.upload-btn.uploaded{
    background:#28a745;
}
.upload-btn input{
    display:none;
}
.filename{
    font-size:11px;
    margin-top:4px;
    color:#666;
}

/* DELETE BUTTON */
.delete-btn{
    width:46px;
    height:46px;
    border:none;
    border-radius:8px;
    background:#ff385c;
    color:white;
    cursor:pointer;
}

/* BUTTONS */
button{
    padding:12px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
.add{ background:#eee; }
.save{ background:#ff385c; color:white; margin-top:15px; }

/* MODAL */
.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    display:none;
    align-items:center;
    justify-content:center;
}
.modal-content{
    background:white;
    padding:30px;
    width:380px;
    border-radius:12px;
    text-align:center;
}
.payment-options{
    display:flex;
    gap:10px;
    margin:20px 0;
}
.pay-btn{
    flex:1;
    padding:12px;
    border-radius:8px;
    border:1px solid #ddd;
    cursor:pointer;
}
.pay-btn.active{
    background:#ff385c;
    color:white;
    border:none;
}
.qr{ display:none; margin-top:15px; }
.qr img{ width:180px; }
.pay-now{ background:#28a745; color:white; width:100%; margin-top:10px; }
.close-btn{ background:#eee; width:100%; margin-top:8px; }
.success{ display:none; font-size:18px; color:#28a745; margin-top:15px; }
</style>
</head>

<body>

<div class="sidebar">
    <div class="logo">HotelApp</div>
    <ul>
        <li onclick="window.location.href='index.html'">Dashboard</li>
        <li onclick="window.location.href='rooms.html'">Rooms</li>
        <li onclick="window.location.href='guestform.html'">Guests</li>
        <li onclick="window.location.href='payments.html'">Payments</li>
        <li onclick="window.location.href='settings.html'">Settings</li>
    </ul>
</div>

<div class="main">
<div class="container">

<h2>Guest Entry</h2>

<div class="top">
    <div class="field">
        <input id="room" placeholder=" ">
        <label>ROOM NO</label>
    </div>

    <input id="checkin" type="date">
    <input id="checkout" type="date">
</div>

<div id="guestContainer">
<div class="row guest">
    <div class="field">
        <input class="name" placeholder=" ">
        <label>NAME</label>
    </div>

    <div>
        <div class="field">
            <input class="mobile" maxlength="10" placeholder=" ">
            <label>MOBILE</label>
        </div>
        <div class="mobile-error"></div>
    </div>

    <select class="doctype">
        <option>AADHAAR</option>
        <option>PASSPORT</option>
        <option>DRIVING LICENSE</option>
        <option>VOTER ID</option>
    </select>

    <div class="field">
        <input class="docnumber" placeholder=" ">
        <label>DOCUMENT NO</label>
    </div>

    <div class="upload-area">
        <label class="upload-btn">UPLOAD DOCUMENT
            <input type="file" class="docfile">
        </label>
        <div class="filename"></div>
    </div>

    <button class="delete-btn" style="display:none;" onclick="removeGuest(this)">✕</button>
</div>
</div>

<button class="add" onclick="addGuest()">+ ADD GUEST</button>
<br>
<button class="save" onclick="validateAndPay()">SAVE & PAY</button>

</div>
</div>

<!-- PAYMENT MODAL -->
<div class="modal" id="paymentModal">
<div class="modal-content">
<h3>Select Payment</h3>
<div class="payment-options">
    <div class="pay-btn" onclick="selectPay(this,'cash')">Cash</div>
    <div class="pay-btn" onclick="selectPay(this,'card')">Card</div>
    <div class="pay-btn" onclick="selectPay(this,'upi')">UPI</div>
</div>
<div class="qr" id="qrBox">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay">
    <p>Scan & Pay</p>
</div>
<button class="pay-now" onclick="completePayment()">PAY NOW</button>
<button class="close-btn" onclick="closePayment()">CLOSE</button>
<div class="success" id="successMsg">Room Booked Successfully</div>
</div>
</div>

<script>
/* ===== AUTO-FILL ROOM NO FROM URL ===== */
document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const room = params.get('room');
    if(room){
        const roomInput = document.getElementById('room');
        roomInput.value = room;
        const label = document.querySelector('#room + label');
        if(label){
            label.style.top = '-8px';
            label.style.fontSize = '11px';
            label.style.color = '#ff385c';
        }
        roomInput.setAttribute('readonly', true);
    }

    // ===== DISABLE PAST DATES =====
    const today = new Date().toISOString().split('T')[0];
    const checkin = document.getElementById('checkin');
    const checkout = document.getElementById('checkout');
    checkin.setAttribute('min', today);
    checkout.setAttribute('min', today);
    checkin.addEventListener('change', () => {
        if(checkin.value){
            checkout.setAttribute('min', checkin.value);
            if(checkout.value && checkout.value < checkin.value){
                checkout.value = checkin.value;
            }
        }
    });
});

/* MOBILE VALIDATION */
document.addEventListener("input",function(e){
    if(e.target.classList.contains("mobile")){
        e.target.value=e.target.value.replace(/[^0-9]/g,'');
        let error=e.target.closest("div").parentElement.querySelector(".mobile-error");
        error.innerText = (e.target.value.length!==10) ? "Mobile must be 10 digits" : "";
    }
});

/* FILE UPLOAD */
document.addEventListener("change",function(e){
    if(e.target.classList.contains("docfile")){
        let file=e.target.files[0]?.name || "";
        let area=e.target.closest(".upload-area");
        area.querySelector(".filename").innerText=file;
        let btn=area.querySelector(".upload-btn");
        btn.classList.add("uploaded");
        btn.childNodes[0].textContent="DOCUMENT UPLOADED";
    }
});

/* ADD GUEST */
function addGuest(){
    let guests=document.querySelectorAll(".guest");
    if(guests.length>=2){ alert("Only 2 guests allowed per room"); return; }
    let row=document.querySelector(".guest").cloneNode(true);
    row.classList.add("second");
    row.querySelectorAll("input").forEach(i=>i.value="");
    row.querySelector(".filename").innerText="";
    row.querySelector(".mobile-error").innerText="";
    let btn=row.querySelector(".upload-btn");
    btn.classList.remove("uploaded");
    btn.childNodes[0].textContent="UPLOAD DOCUMENT";
    row.querySelector(".delete-btn").style.display="block";
    document.getElementById("guestContainer").appendChild(row);
}

/* DELETE GUEST */
function removeGuest(btn){ btn.closest(".guest").remove(); }

/* VALIDATION */
function validateAndPay(){
    let room=document.getElementById("room").value.trim();
    let checkin=document.getElementById("checkin").value;
    let checkout=document.getElementById("checkout").value;
    if(room===""||checkin===""||checkout===""){ alert("Please fill Room No, Check-in and Check-out"); return; }
    let guests=document.querySelectorAll(".guest");
    for(let g of guests){
        let name=g.querySelector(".name").value.trim();
        let mobile=g.querySelector(".mobile").value.trim();
        let doc=g.querySelector(".docnumber").value.trim();
        if(name===""||mobile===""||doc===""){ alert("Please complete guest details"); return; }
        if(mobile.length!==10){ alert("Mobile must be 10 digits"); return; }
    }
    openPayment();
}

/* PAYMENT FUNCTIONS */
function openPayment(){ document.getElementById("paymentModal").style.display="flex"; }
function closePayment(){ document.getElementById("paymentModal").style.display="none"; resetForm(); }
function selectPay(el,type){
    document.querySelectorAll(".pay-btn").forEach(b=>b.classList.remove("active"));
    el.classList.add("active");
    document.getElementById("qrBox").style.display = (type==="upi") ? "block" : "none";
}
function completePayment(){
    document.getElementById("successMsg").style.display="block";
    setTimeout(()=>{
        document.getElementById("paymentModal").style.display="none";
        document.getElementById("successMsg").style.display="none";
        resetForm();
    },2000);
}

/* RESET FORM */
function resetForm(){
    document.querySelectorAll("input").forEach(i=>i.value="");
    document.querySelectorAll(".filename").forEach(f=>f.innerText="");
    document.querySelectorAll(".mobile-error").forEach(e=>e.innerText="");
    document.querySelectorAll(".upload-btn").forEach(btn=>{
        btn.classList.remove("uploaded");
        btn.childNodes[0].textContent="UPLOAD DOCUMENT";
    });
}
</script>

</body>
</html>
