<!DOCTYPE html>
<html>
<head>
<base target="_top">

<link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet">

<style>

body,input,select,button,textarea{
font-family:'Glacial Indifference',sans-serif;
text-transform:none;
}

body{
background:#f5f5f5;
margin:0;
}

.sidebar{
width:200px;
background:#fff;
height:100vh;
position:fixed;
top:0;
left:0;
box-shadow:2px 0 5px rgba(0,0,0,0.1);
padding:20px 10px;
}

.sidebar ul{
list-style:none;
padding:0;
}

.sidebar ul li{
padding:10px;
cursor:pointer;
border-radius:6px;
}

.sidebar ul li:hover{
background:#ff385c;
color:#fff;
}

.main{
margin-left:220px;
padding:30px;
}

.container{
background:#fff;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.top,.row{
display:flex;
gap:12px;
margin-bottom:15px;
}

input,select{
height:46px;
border:1px solid #ddd;
border-radius:8px;
padding:0 12px;
font-size:14px;
}

.field{
position:relative;
}

.field label{
position:absolute;
top:14px;
left:12px;
font-size:12px;
color:#777;
background:#fff;
padding:0 4px;
}

.upload-btn{
background:#ff385c;
color:#fff;
height:46px;
display:flex;
align-items:center;
justify-content:center;
border-radius:8px;
cursor:pointer;
padding:0 15px;
}

.upload-btn input{
display:none;
}

.upload-btn.uploaded{
background:#28a745;
}

.filename{
font-size:11px;
margin-top:3px;
}

button{
border:none;
border-radius:8px;
cursor:pointer;
}

.add{
background:#eee;
padding:10px 15px;
}

.save{
background:#ff385c;
color:#fff;
padding:12px 20px;
margin-top:15px;
}

.delete-btn{
width:46px;
height:46px;
background:#ff385c;
color:#fff;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:none;
align-items:center;
justify-content:center;
}

.modal-content{
background:#fff;
padding:30px;
width:350px;
border-radius:10px;
text-align:center;
}

.payment-options{
display:flex;
gap:10px;
margin:20px 0;
}

.pay-btn{
flex:1;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
cursor:pointer;
}

.pay-btn.active{
background:#ff385c;
color:#fff;
border:none;
}

.qr{
display:none;
}

.qr img{
width:180px;
}

.pay-now{
background:#28a745;
color:#fff;
width:100%;
margin-top:10px;
}

.close-btn{
background:#eee;
width:100%;
margin-top:8px;
}

.success{
display:none;
color:#28a745;
margin-top:10px;
}

</style>
</head>

<body>

<div class="sidebar">
<ul>
<li onclick="goPage('rooms.html')">Rooms</li>
<li onclick="goPage('form.html')">Guests</li>
<li onclick="goPage('payments.html')">Payments</li>
</ul>
</div>

<div class="main">

<div class="container">

<h2>Guest Entry</h2>

<div class="top">

<input id="room" readonly placeholder="Room No">

<input id="checkin" type="date">

<input id="checkout" type="date">

</div>

<div id="guestContainer">

<div class="row guest">

<input class="name" placeholder="Name">

<input class="mobile" maxlength="10" placeholder="Mobile">

<select class="doctype">
<option>AADHAAR</option>
<option>PASSPORT</option>
<option>DRIVING LICENSE</option>
<option>VOTER ID</option>
</select>

<input class="docnumber" placeholder="Document No">

<div>

<label class="upload-btn">
UPLOAD DOCUMENT
<input type="file" class="docfile">
</label>

<div class="filename"></div>

</div>

<button class="delete-btn" style="display:none;" onclick="removeGuest(this)">✕</button>

</div>

</div>

<button class="add" onclick="addGuest()">+ ADD GUEST</button>

<br>

<button class="save" onclick="validateAndPay()">SAVE & PAY</button>

</div>

</div>

<!-- PAYMENT MODAL -->

<div class="modal" id="paymentModal">

<div class="modal-content">

<h3>Select Payment</h3>

<div class="payment-options">

<div class="pay-btn" data-method="Cash" onclick="selectPay(this)">Cash</div>

<div class="pay-btn" data-method="Card" onclick="selectPay(this)">Card</div>

<div class="pay-btn" data-method="UPI" onclick="selectPay(this)">UPI</div>

</div>

<div class="qr" id="qrBox">

<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay">

</div>

<button class="pay-now" onclick="completePayment()">PAY NOW</button>

<button class="close-btn" onclick="closePayment()">CLOSE</button>

<div class="success" id="successMsg">Room Booked Successfully</div>

</div>

</div>

<script>

function goPage(url){
window.location.href=url;
}

let selectedPaymentMethod="";
let paymentStatus="Unpaid";

function addGuest(){

let guests=document.querySelectorAll(".guest");

if(guests.length>=2){
alert("Only 2 guests allowed");
return;
}

let row=document.querySelector(".guest").cloneNode(true);

row.querySelectorAll("input").forEach(i=>i.value="");

row.querySelector(".filename").innerText="";

row.querySelector(".delete-btn").style.display="block";

document.getElementById("guestContainer").appendChild(row);

}

function removeGuest(btn){
btn.closest(".guest").remove();
}

document.addEventListener("change",function(e){

if(e.target.classList.contains("docfile")){

let file=e.target.files[0];

let area=e.target.closest("div");

area.querySelector(".filename").innerText=file.name;

}

});

function validateAndPay(){

let room=document.getElementById("room").value;

let checkin=document.getElementById("checkin").value;

let checkout=document.getElementById("checkout").value;

if(room==""||checkin==""||checkout==""){
alert("Fill room and dates");
return;
}

let guests=document.querySelectorAll(".guest");

for(let g of guests){

let name=g.querySelector(".name").value;

let mobile=g.querySelector(".mobile").value;

let doc=g.querySelector(".docnumber").value;

let file=g.querySelector(".docfile").files[0];

if(!name||!mobile||!doc||!file){
alert("Complete guest details and upload document");
return;
}

}

openPayment();

}

function openPayment(){
document.getElementById("paymentModal").style.display="flex";
}

function closePayment(){
document.getElementById("paymentModal").style.display="none";
}

function selectPay(el){

document.querySelectorAll(".pay-btn").forEach(b=>b.classList.remove("active"));

el.classList.add("active");

selectedPaymentMethod=el.dataset.method;

if(selectedPaymentMethod=="UPI"){
document.getElementById("qrBox").style.display="block";
paymentStatus="Unpaid";
}else{
document.getElementById("qrBox").style.display="none";
paymentStatus="Paid";
}

}

function completePayment(){

if(selectedPaymentMethod==""){
alert("Select payment method");
return;
}

if(selectedPaymentMethod=="UPI"){
paymentStatus="Paid";
}

document.getElementById("successMsg").style.display="block";

setTimeout(()=>{
submitToSheet();
},1000);

}

function toBase64(file){

return new Promise((resolve,reject)=>{

let reader=new FileReader();

reader.readAsDataURL(file);

reader.onload=()=>resolve(reader.result.split(',')[1]);

reader.onerror=error=>reject(error);

});

}

async function getGuests(){

let guests=[];

for(let g of document.querySelectorAll(".guest")){

let file=g.querySelector(".docfile").files[0];

let base64=await toBase64(file);

guests.push({

name:g.querySelector(".name").value,

mobile:g.querySelector(".mobile").value,

docType:g.querySelector(".doctype").value,

docNumber:g.querySelector(".docnumber").value,

file:{
name:file.name,
type:file.type,
data:base64
}

});

}

return guests;

}

async function submitToSheet(){

const room=document.getElementById("room").value;

const checkin=document.getElementById("checkin").value;

const checkout=document.getElementById("checkout").value;

const guests=await getGuests();

const data={
room,
checkin,
checkout,
guests,
paymentMethod:selectedPaymentMethod,
paymentStatus:paymentStatus
};

fetch("YOUR_WEB_APP_URL",{
method:"POST",
body:JSON.stringify(data)
})
.then(r=>r.json())
.then(res=>{

if(res.status=="success"){
window.location.href="rooms.html";
}else{
alert("Submission failed");
}

});

}

window.addEventListener("DOMContentLoaded",function(){

const params=new URLSearchParams(window.location.search);

const room=params.get("room");

if(room){
document.getElementById("room").value=room;
}

const today=new Date().toISOString().split('T')[0];

let checkin=document.getElementById("checkin");

let checkout=document.getElementById("checkout");

checkin.min=today;

checkout.min=today;

checkin.addEventListener("change",function(){
checkout.min=checkin.value;
});

});

</script>

</body>
</html>
